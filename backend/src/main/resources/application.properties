spring.application.name=pawly

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pawly_db}
spring.datasource.username=${DB_USERNAME:pawly_app}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

server.port=${PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
security.rate-limit.login.max-requests=${LOGIN_RATE_LIMIT_MAX:10}
security.rate-limit.login.window-seconds=${LOGIN_RATE_LIMIT_WINDOW_SECONDS:900}
security.rate-limit.register.max-requests=${REGISTER_RATE_LIMIT_MAX:5}
security.rate-limit.register.window-seconds=${REGISTER_RATE_LIMIT_WINDOW_SECONDS:3600}

logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.boot=INFO
logging.level.org.hibernate=INFO
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=OFF



